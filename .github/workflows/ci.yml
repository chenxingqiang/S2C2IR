name: ci

# Replays checks that were run by hand. A pass here does not change the
# semantic baseline, does not set can-run-plan, and does not open a cut.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host contract and matrix printers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Replay host checks
        run: scripts/check-host.sh --log host-logs
      - name: Upload host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-logs
          path: host-logs
          if-no-files-found: ignore

  check-s2c2:
    # The main ruleset requires this context string. The steps below
    # still build and test against LLVM/MLIR 22, where shard lives.
    name: check-s2c2 (LLVM/MLIR 20)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/MLIR 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libstdc++-14-dev \
            clang-22 llvm-22-dev llvm-22-tools libmlir-22-dev mlir-22-tools
      - name: Install lit
        # lit 23 rejects this tree's lit.cfg.py. Match the LLVM 18 line.
        run: |
          python3 -m pip install --user 'lit==18.1.8'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DMLIR_DIR=/usr/lib/llvm-22/lib/cmake/mlir \
            -DLLVM_EXTERNAL_LIT="$(command -v lit)"
      - name: Build s2c2-opt
        run: cmake --build build --target s2c2-opt
      - name: Run check-s2c2
        run: cmake --build build --target check-s2c2
